[project]
name = "rag-hardware-system"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs PostgreSQL + pgvector (TEST_DATABASE_URL)",
    "models: downloads and runs the real local embedding / reranker models",
]
addopts = "-m 'not models'"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501", "UP042", "SIM108"]  # B008: FastAPI Depends(); E501: long regex/SQL literals (formatter handles code)
